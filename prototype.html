<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blurit V2 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#ECEAEE;--pink:#E9548F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);font-family:-apple-system,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;color:#111113;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.ic{display:inline-block;vertical-align:middle;flex:none}

/* ---------- stage ---------- */
.stage{height:100%;display:grid;grid-template-columns:300px 1fr 300px;gap:24px;padding:20px 24px}
.panel,.notes{overflow:auto;padding:4px 2px 24px}
.panel h1{font-size:20px;letter-spacing:-.02em;margin:4px 0 4px}
.panel .kick{font:600 11px/1.2 Inter,system-ui;letter-spacing:.06em;text-transform:uppercase;color:#77737F}
.panel p{font-size:13px;color:#57535F;margin:6px 0 14px;line-height:1.45}
.pgrp{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.pgrp h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#77737F}
.jbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:13.5px;font-weight:500}
.jbtn:hover{background:#F2F0F5}.jbtn .n{font:600 11px Inter;color:#fff;background:#5564FF;border-radius:6px;padding:2px 6px}
.jbtn small{display:block;color:#77737F;font-weight:400;font-size:12px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px;font-size:13.5px}
.mini{width:34px;height:20px;border-radius:10px;background:#D7D4DC;position:relative;flex:none}.mini::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.mini.on{background:#5564FF}.mini.on::after{left:16px}
.screens{display:flex;flex-wrap:wrap;gap:6px}.screens button{font-size:12px;background:#F2F0F5;border-radius:8px;padding:5px 8px}.screens button.cur{background:#5564FF;color:#fff}
.resetb{width:100%;padding:9px;border-radius:10px;background:#111113;color:#fff;font-weight:600;font-size:13px}
.notes .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.notes h2{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}.notes .sid{font:600 11px Inter;color:#77737F;letter-spacing:.05em;text-transform:uppercase}
.notes ul{padding-left:18px;margin:10px 0 0;font-size:13.5px;line-height:1.5;color:#3b3842}.notes li{margin:5px 0}
.notes .why{font-size:13px;color:#57535F;line-height:1.5;margin-top:10px}
.legend2{font-size:12.5px;color:#57535F;line-height:1.7}.legend2 i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.devwrap{display:flex;align-items:flex-start;justify-content:center;min-height:0}
.device{transform-origin:top center;padding:12px;border-radius:66px;background:#1B1A1F;box-shadow:0 30px 80px -30px rgba(20,10,40,.45),inset 0 0 0 2px #3A3940}

/* ---------- phone ---------- */
#phone{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#000;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:60;pointer-events:none}
#screen{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
.scr.light,.sheet-l.light{--bg:#F8F6F7;--paper:#fff;--ink:#111113;--muted:#67636F;--fill:#EFEDF1;--fill2:#E2DFE6;--line:#E4E1E8;--acc:#5564FF;--acc-t:#3F4BD6;--acc-soft:#E6E9FF;--glass:rgba(255,255,255,.85)}
.scr.dark,.sheet-l.dark{--bg:#000;--paper:#1C1C1E;--ink:#fff;--muted:#A19EAA;--fill:#2A2A2E;--fill2:#3A3A3F;--line:#2E2E33;--acc:#5564FF;--acc-t:#8E9BFF;--acc-soft:rgba(85,100,255,.22);--glass:rgba(40,40,46,.85)}
.a-push{animation:push .32s cubic-bezier(.2,.8,.2,1)}.a-pop{animation:pop2 .28s cubic-bezier(.2,.8,.2,1)}.a-fade{animation:fade .25s}
@keyframes push{from{transform:translateX(60px);opacity:.3}to{transform:none;opacity:1}}
@keyframes pop2{from{transform:translateX(-40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.sbar{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px 38px;font-weight:600;font-size:16px}
.sbar .r{display:flex;gap:6px;align-items:center}
.hind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:55;pointer-events:none}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:0 20px 34px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body.tight{padding:0 14px 0}
.grow{flex:1}
.row{display:flex;align-items:center;gap:8px}.sbw{justify-content:space-between}.col{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.ctr{text-align:center;align-items:center}
.h1{font-size:32px;line-height:38px;font-weight:700;letter-spacing:-.6px;margin:18px 0 8px}
.h2{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.4px;margin:0}
.h3{font-size:17px;font-weight:600;margin:0}
.sub{font-size:15px;line-height:21px;color:var(--muted);margin:0}
.cap{font-size:13px;line-height:18px;color:var(--muted)}
.sect{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px}
.acc{color:var(--acc-t)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;font-size:17px;font-weight:600;width:100%;flex:none}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 10px 24px -10px rgba(85,100,255,.9),inset 0 1px 0 rgba(255,255,255,.25);background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%)}
.btn.pri:active{background-color:#4553E6;transform:scale(.98)}
.btn.sec{background:var(--fill);color:var(--ink)}
.btn.sm{height:38px;font-size:15px;width:auto;padding:0 16px}
.btn.xs{height:30px;font-size:13px;width:auto;padding:0 12px}
.btn.dis{opacity:.4;pointer-events:none;box-shadow:none}
.btn.danger{background:#C23B3B;color:#fff}
.link{color:var(--acc-t);font-weight:600;font-size:15px;text-align:center;padding:12px 0}
.ib{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--glass);box-shadow:0 1px 3px rgba(0,0,0,.08);flex:none;backdrop-filter:blur(12px)}
.ib.sm{width:34px;height:34px}
.ib.dis{opacity:.35;pointer-events:none}
.nav{display:flex;align-items:center;gap:8px;padding:2px 14px 8px;min-height:52px;flex:none}
.nav .t{flex:1;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ctrT{text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--fill);padding:8px 13px;font-weight:500;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--acc-soft);color:var(--acc-t);box-shadow:inset 0 0 0 1.5px var(--acc)}
.chip.sm{padding:5px 10px;font-size:12.5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.chips::-webkit-scrollbar{display:none}
.tg{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.tg.on{background:var(--acc)}.tg.on::after{left:22px}
.seg{display:flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;padding:7px 6px;border-radius:999px;font-weight:500;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.dark .seg button.on{background:#48474F}
.list{background:var(--paper);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:50px;font-size:16px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}.li .v{margin-left:auto;color:var(--muted);font-size:15px;display:flex;align-items:center;gap:6px}
.li.danger{color:#C23B3B;justify-content:center;font-weight:600}
.card{background:var(--paper);border-radius:18px;padding:14px}
.toastL{position:absolute;left:0;right:0;bottom:112px;display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.94);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:340px;animation:toastin .3s cubic-bezier(.2,.8,.2,1)}
.toast b{color:#9DA7FF;font-weight:700;margin-left:6px}
@keyframes toastin{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.notif{position:absolute;top:8px;left:8px;right:8px;z-index:90;background:rgba(245,245,247,.96);color:#111;border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:notif .4s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.notif .ai{width:38px;height:38px;border-radius:10px;background:#5564FF;display:grid;place-items:center;color:#fff;flex:none}
.notif b{display:block;font-size:14px}.notif small{font-size:13px;color:#555}
@keyframes notif{from{transform:translateY(-100px)}to{transform:none}}

/* sheet */
#sheetLayer{position:absolute;inset:0;z-index:70;pointer-events:none}
#sheetLayer.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);animation:fade .2s}
.sheet-l{position:absolute;left:0;right:0;bottom:0;max-height:86%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:32px 32px 0 0;padding:8px 18px 30px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet-l.in{animation:sheetin .34s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
.sheet-l.dark{background:#1C1C1E}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--fill2);align-self:center;margin:2px 0 10px;flex:none}
.shb{overflow-y:auto;min-height:0;scrollbar-width:none;display:flex;flex-direction:column}.shb::-webkit-scrollbar{display:none}
.sheet-l.alert{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:290px;border-radius:16px;padding:0;background:rgba(242,242,246,.97);color:#111;text-align:center;overflow:hidden}
.sheet-l.alert.in{animation:alertin .25s}
@keyframes alertin{from{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
.alert .ah{padding:18px 16px 14px}.alert .ah b{font-size:17px;display:block}.alert .ah p{font-size:13px;margin:4px 0 0;color:#333}
.alert .ab{display:block;width:100%;border-top:.5px solid #C6C6C8;padding:11px;font-size:17px;color:#0A7AFF}
.alert .ab.b{font-weight:600}
.simtag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;color:#57535F;border-radius:999px;font-size:11px;padding:4px 10px;white-space:nowrap}

/* photo + covers */
.photo{position:relative;overflow:hidden;border-radius:20px;background:#111;flex:none;touch-action:none}
.photo .img{position:absolute;left:0;width:100%;background-size:100% 100%;background-repeat:no-repeat}
.cv{position:absolute;display:grid;place-items:center;font-style:normal;line-height:1;pointer-events:none;transition:opacity .12s}
.cv.emoji{filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.cv.blur{border-radius:50%;-webkit-backdrop-filter:blur(var(--b));backdrop-filter:blur(var(--b));background:rgba(255,255,255,.03)}
.cv.blur.motion{transform:scaleX(1.2);-webkit-backdrop-filter:blur(var(--b)) contrast(.9);backdrop-filter:blur(var(--b)) contrast(.9)}
.cv.blur.frosted{-webkit-backdrop-filter:blur(var(--b)) saturate(.5) brightness(1.15);backdrop-filter:blur(var(--b)) saturate(.5) brightness(1.15);background:rgba(255,255,255,.2)}
.cv.blur.rect,.cv.pixel.rect,.cv.shape.rect{border-radius:8px}
.cv.pixel{border-radius:22%;overflow:hidden}
.cv.pixel canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.cv.shape{border-radius:50%}
.cv.ghost{border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 26px 12px rgba(255,255,255,.55)}
.cv.erase{border-radius:50%;-webkit-backdrop-filter:blur(28px) saturate(.2);backdrop-filter:blur(28px) saturate(.2);box-shadow:0 0 30px 18px rgba(0,0,0,.05)}
.cv.swap{border-radius:46%;background-repeat:no-repeat;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.cv.keep{border-radius:46%;border:2px solid #3FC07A}
.cv.keep em{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:#23794A;color:#fff;font:600 11px/1 -apple-system,Inter,system-ui;padding:4px 8px;border-radius:999px;font-style:normal;white-space:nowrap}
.cv.dots{border:1.5px solid #9DA7FF;border-radius:14px;background:radial-gradient(circle,#D0D5FF 1.4px,transparent 1.9px) 0 0/8px 8px;animation:pop .35s}
.cv.sel{border:2.5px solid #fff;border-radius:16px;box-shadow:0 0 0 1.5px #5564FF,0 2px 10px rgba(0,0,0,.4)}
.cv.predict{border:2px dashed #FF6B6B;border-radius:16px;background:rgba(255,80,80,.1)}
.cv.hid{opacity:0}
.photo.compare .cv:not(.keep){opacity:0}
.hot{position:absolute;border-radius:50%;z-index:4}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.62);color:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;white-space:nowrap;z-index:5;pointer-events:none;backdrop-filter:blur(10px)}
.scanline{position:absolute;left:0;right:0;height:2px;background:#8E9BFF;box-shadow:0 0 16px 4px rgba(85,100,255,.7);animation:scanl 1.6s ease-in-out infinite alternate}
@keyframes scanl{from{top:15%}to{top:85%}}

/* avatars */
.av{border-radius:50%;flex:none;background-repeat:no-repeat;background-color:#ccc;position:relative;overflow:hidden;display:inline-block}
.av .blurov{position:absolute;inset:0;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}

/* welcome / onboarding */
.pills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.pills span{border:1px dashed var(--fill2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.steps{display:flex;gap:5px;flex:1}.steps i{flex:1;height:4px;border-radius:4px;background:var(--fill2)}.steps i.on{background:var(--acc)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--paper);border:1.5px solid transparent;width:100%;text-align:left}
.opt .oi{width:40px;height:40px;border-radius:12px;background:var(--fill);display:grid;place-items:center;flex:none}
.opt b{display:block;font-size:16px}.opt small{color:var(--muted);font-size:13.5px}
.opt.on{border-color:var(--acc);background:var(--acc-soft)}.opt.on .oi{background:var(--acc);color:#fff}
.opt .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--fill2);display:grid;place-items:center;flex:none}
.opt.on .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.perm{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}.perm span{height:64px;border-radius:14px;background-size:cover;background-position:center;opacity:.35}.perm span.on{opacity:1;box-shadow:0 0 0 3px var(--acc)}
.nexti{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border-radius:16px;padding:14px;font-size:14px;line-height:20px}
.big-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto}

/* home */
.logo{font-size:28px;font-weight:800;letter-spacing:-.8px}
.tiles{display:flex;gap:10px}
.tile{flex:1;border-radius:22px;background:var(--paper);padding:16px;display:flex;flex-direction:column;gap:2px;min-height:110px;justify-content:flex-end;text-align:left}
.tile b{font-size:18px}.tile small{color:var(--muted);font-size:13px}
.tile.pri{background:var(--acc);color:#fff;box-shadow:0 14px 28px -14px rgba(85,100,255,.95);background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,0) 50%)}.tile.pri small{color:rgba(255,255,255,.85)}
.proj{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{text-align:left;display:flex;flex-direction:column;gap:6px}
.pc .th{position:relative;height:200px;border-radius:18px;overflow:hidden;background:#222}
.pc b{font-size:15px}.pc small{font-size:13px;color:var(--muted)}
.state{position:absolute;right:8px;top:8px;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}
.state.ok{background:#E3F3E8;color:#2E7348}.state.warn{background:#FFF1DE;color:#9A5200}.state.draft{background:rgba(255,255,255,.9);color:#333}
.dur{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:600;display:flex;gap:4px;align-items:center}
.lc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:1.5px dashed var(--fill2);text-align:left;width:100%}
.lc b{display:block;font-size:15px}.lc small{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--acc-soft);color:var(--acc-t)}

/* import */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -14px}
.pgrid>button{position:relative;aspect-ratio:1;background-size:cover;background-color:#ddd}
.pgrid>button.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px #5564FF;background:rgba(85,100,255,.12)}
.pgrid .num{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.2);font:700 13px/21px -apple-system,Inter;color:#fff;text-align:center;z-index:2}
.pgrid .sel .num{background:#5564FF;border-color:#5564FF}
.pgrid .fc{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 7px;font-size:11.5px;display:flex;gap:3px;align-items:center;z-index:2}
.pgrid .dv{position:absolute;right:6px;bottom:6px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2}
.camt{display:grid!important;place-items:center;background:#111113!important;color:#fff}
.limited{font-size:13.5px;color:var(--muted);background:var(--paper);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.qbanner{display:flex;gap:10px;align-items:center;background:var(--acc-soft);color:var(--acc-t);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600}
.bottombar{padding:10px 14px 34px;display:flex;gap:10px;background:linear-gradient(180deg,transparent,var(--bg) 30%);flex:none}

/* scan */
.prog{height:6px;border-radius:6px;background:var(--fill);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
.lrows{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:500;animation:pop .3s}
.lrow small{margin-left:auto;color:var(--muted);font-weight:400}
.lrow.sk{color:var(--muted);background:linear-gradient(90deg,var(--paper),var(--fill),var(--paper));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{from{background-position:200% 0}to{background-position:0 0}}

/* roster */
.pr{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:10px 10px 10px 12px;border:1.5px solid transparent}
.pr.me{border-color:#3C8A57;background:#EEF8F1}
.pr .nm{flex:1;min-width:0}.pr b{display:block;font-size:15.5px}.pr small{font-size:12.5px;color:var(--muted)}
.mseg{display:flex;background:var(--fill);border-radius:999px;padding:3px}
.mseg button{padding:7px 9px;border-radius:999px;font-size:13px;font-weight:500;min-width:40px}
.mseg button.on{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:700}
.pr.me .mseg{background:#DCEFE3}
.meq{display:inline-flex;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--acc-t);background:var(--acc-soft);border-radius:999px;padding:3px 9px}
.av2{width:44px;height:44px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;justify-items:center}
.fgrid button{position:relative}
.fgrid .st{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:2px solid var(--bg)}
.st.b{background:#5564FF;color:#fff}.st.v{background:#3C8A57;color:#fff}

/* editor */
.playrow{display:flex;align-items:center;gap:6px;padding:8px 14px 4px;font-size:13px;color:var(--muted)}
.playrow .tm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.tl{position:relative;margin:4px 14px 0;background:#141417;border-radius:14px;padding:6px 8px 8px;font-size:11.5px;color:#A19EAA;touch-action:none}
.tlh{display:flex;justify-content:space-between;margin-left:62px;padding-bottom:4px;font-variant-numeric:tabular-nums}
.trk{position:relative;height:22px;margin:4px 0 0 62px;border-radius:6px;background:#202027}
.trk em{position:absolute;left:-62px;width:58px;top:4px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#C9C6D2}
.trk .clip{position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(90deg,#3B3A45 0 20px,#2E2D36 20px 21px)}
.trk .bar{position:absolute;top:3px;bottom:3px;border-radius:5px}
.trk .gap{position:absolute;top:3px;bottom:3px;border-radius:4px;background:repeating-linear-gradient(135deg,#E5484D 0 3px,#5a2020 3px 6px)}
.trk.more{background:transparent;border:1px dashed #3A3946;height:22px}.trk.more span{position:absolute;left:8px;top:3px;color:#C9C6D2}
.ph{position:absolute;top:22px;bottom:6px;width:2px;background:#fff;border-radius:2px;margin-left:62px;box-shadow:0 0 6px rgba(255,255,255,.6)}
.ph::before{content:"";position:absolute;top:-6px;left:-4px;width:10px;height:10px;border-radius:50%;background:#fff}
.warnbar{margin:8px 14px 0;display:flex;align-items:center;gap:8px;background:rgba(229,72,77,.16);color:#FF9A9A;border-radius:12px;padding:8px 8px 8px 12px;font-size:13.5px}
.warnbar .btn{margin-left:auto;background:#C23B3B;color:#fff}
.ebar{display:flex;justify-content:space-around;padding:8px 10px 30px;border-top:.5px solid var(--line);flex:none;background:#000}
.ebar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#C9C6D2;padding:6px 10px;border-radius:14px;min-width:72px}
.ebar button.on{color:#B4BCFF;background:rgba(85,100,255,.18)}

/* studio */
.stabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.stabs::-webkit-scrollbar{display:none}
.stabs button{padding:7px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.stabs button.on{background:var(--acc);color:#fff}
.gd{display:inline-block;width:8px;height:8px;border-radius:50%}.gd.pg{background:#3FAE6A}.gd.sty{background:#E0A030}
.stabs button.on .gd{box-shadow:0 0 0 2px #fff}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 2px 4px}.leg span{display:flex;gap:5px;align-items:center}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.sgrid button{aspect-ratio:1;border-radius:16px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:26px;position:relative}
.sgrid button small{font-size:11px;color:var(--muted);font-weight:500}
.sgrid button.on{box-shadow:inset 0 0 0 2.5px var(--acc);background:var(--acc-soft)}
.sgrid .prv{width:34px;height:34px;border-radius:50%;display:block}
.sgrid .lock{position:absolute;top:5px;right:5px;font-size:9px;font-weight:800;background:#5564FF;color:#fff;border-radius:5px;padding:2px 4px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--fill2);outline:none;flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.val{font-variant-numeric:tabular-nums;font-weight:700;width:34px;text-align:right;font-size:14px}
.warnote{display:flex;gap:8px;align-items:flex-start;background:rgba(224,160,48,.16);color:#F2C27A;border-radius:12px;padding:10px 12px;font-size:13px;line-height:18px}
.light .warnote{background:#FFF1DE;color:#7A4300}
.emg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.emg button{font-size:28px;aspect-ratio:1;border-radius:12px}.emg button:active{background:var(--fill)}
.packs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.packs button{background:var(--fill);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:24px;position:relative}
.packs small{font-size:11.5px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:9px 12px;color:var(--muted)}
.search input{border:0;background:transparent;outline:none;flex:1;color:var(--ink);font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mgrid button{background:var(--fill);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500}
.crow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.crow .cvi{width:40px;height:40px;border-radius:12px;background:var(--fill);display:grid;place-items:center;font-size:22px;flex:none}
.crow b{font-size:15px;display:block}.crow small{font-size:12.5px;color:var(--muted)}

/* brush */
.mask{position:absolute;border-radius:12px;background:rgba(229,57,53,.45);box-shadow:0 0 0 2px #FF6B6B;pointer-events:none;animation:pop .25s}
.bdot{position:absolute;border-radius:50%;background:rgba(229,57,53,.5);pointer-events:none}
.tapdot{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,255,255,.35);transform:translate(-50%,-50%);pointer-events:none}
.loupe{position:absolute;left:10px;top:10px;width:86px;height:86px;border-radius:50%;border:3px solid #fff;background-repeat:no-repeat;box-shadow:0 6px 16px rgba(0,0,0,.45);pointer-events:none;z-index:6}

/* gaps */
.frames{position:relative;display:flex;gap:4px}
.frames span{flex:1;height:52px;border-radius:8px;background-size:cover;background-position:center;border-bottom:4px solid #3FAE6A;transition:border-color .3s}
.frames span.gap{border-bottom-color:#E5484D;filter:saturate(.4) brightness(.7)}
.frames .hs,.frames .he{position:absolute;top:-6px;bottom:-6px;width:6px;border-radius:3px}.frames .hs{background:#3FAE6A}.frames .he{background:#E5484D}

/* audio */
.wave{display:flex;align-items:center;gap:3px;height:70px;background:var(--paper);border-radius:16px;padding:0 12px}
.wave i{flex:1;background:#6E6B7E;border-radius:2px;transition:background .2s}
.wave i.bl{background:var(--pink)}.wave i.pl{background:#fff}
.trans{font-size:17px;line-height:26px;background:var(--paper);border-radius:16px;padding:14px 16px}
.trans mark{border-radius:6px;padding:1px 4px;color:inherit}
.trans mark.off{background:rgba(233,84,143,.28)}.trans mark.bleep{background:#E9548F;color:#fff}.trans mark.mute{background:#3A3A3F;color:#8D8A97;text-decoration:line-through}
.trans mark.flash{animation:fl .4s}@keyframes fl{50%{transform:scale(1.15)}}

/* check */
.score{background:var(--paper);border-radius:20px;padding:16px}
.score b{font-size:22px;display:block;letter-spacing:-.3px}.score small{color:var(--muted);font-size:14px}
.segb{display:flex;gap:5px;margin-top:12px}.segb i{flex:1;height:8px;border-radius:4px;background:var(--fill2);transition:background .3s}.segb i.on{background:#3C8A57}
.chk{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:14px;font-size:15px;width:100%;text-align:left;min-height:52px}
.chk.ok{background:#E3F3E8;color:#1F5A35}.chk.bad{background:#FFF1DE;color:#6B3A00}.chk.info{background:var(--paper);color:var(--ink)}
.chk .btn{margin-left:auto}
.chk .ci{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.chk.ok .ci{background:#3C8A57;color:#fff}.chk.bad .ci{background:#C26A00;color:#fff}.chk.info .ci{background:var(--fill);color:var(--muted)}

/* batch */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bgrid span{position:relative;aspect-ratio:1;border-radius:12px;background-size:cover;background-position:center}
.bgrid .bs{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.bs.ok{background:#2E7348}.bs.warn{background:#9A5200}.bs.wait{background:rgba(0,0,0,.45)}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* live */
.cam{position:relative;flex:1;background-size:cover;background-position:center}
.camtop{position:absolute;top:58px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.cambot{position:absolute;bottom:40px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:5}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center}
.shutter i{width:58px;height:58px;border-radius:50%;background:#E5484D;transition:.2s}
.shutter.rec i{width:28px;height:28px;border-radius:8px}
.rec{background:rgba(194,59,59,.92);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.camc{position:absolute;display:grid;place-items:center;font-style:normal;border-radius:50%;transition:all .2s}

/* enroll */
.ring{width:190px;height:190px;border-radius:50%;margin:10px auto 0;display:grid;place-items:center}
.ring .av{width:170px;height:170px}
.consent{display:flex;flex-direction:column;gap:10px;background:var(--paper);border-radius:16px;padding:14px;font-size:15px;text-align:left;width:100%}
.consent div{display:flex;gap:10px;align-items:center}.consent .ic{color:var(--acc-t)}
.plan{border-radius:18px;padding:14px 16px;background:var(--paper);border:2px solid transparent;width:100%;text-align:left;position:relative}
.plan b{font-size:17px;display:block}.plan small{color:var(--muted);font-size:14px}
.plan.on{border-color:var(--acc);background:var(--acc-soft)}
.plan .tag{position:absolute;right:14px;top:14px}
.perk{display:flex;gap:12px;align-items:center;font-size:16px;padding:6px 0}.perk .ic{color:var(--acc-t)}
.legal{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted)}.legal button{text-decoration:underline}

/* hotspot flash */
#phone.flash [data-go],#phone.flash [data-act]:not(.scrim){outline:2px solid rgba(85,100,255,.85);outline-offset:2px;border-radius:12px}
.hotsp #phone [data-go],.hotsp #phone [data-act]:not(.scrim){outline:2px dashed rgba(85,100,255,.6);outline-offset:1px}

@media (max-width:1180px){.stage{grid-template-columns:280px 1fr}.notes{display:none}}
@media (max-width:820px){.stage{grid-template-columns:1fr;padding:0}.panel{display:none}.device{padding:0;border-radius:0;background:none;box-shadow:none}#phone{border-radius:0}}
</style>
</head>

function geoF(img,W,H,fy=.47,video=false){const IH=W/AR[img];const T=Math.max(H-IH,Math.min(0,H/2-fy*IH));return{img,W,H,IH,T,video};}
function bx(b,g,G){const[cx,cy,w,h]=b;const ww=w*g*G.W,hh=h*g*G.IH;return{l:cx*G.W-ww/2,t:cy*G.IH+G.T-hh/2,w:ww,h:hh};}
const pst=p=>`left:${p.l}px;top:${p.t}px;width:${p.w}px;height:${p.h}px`;
function coverEl(b,cv,G,o={}){
 const g=(o.grow||1.32)*(o.size||1);const p=bx(b,g,G);const st=pst(p);const id=o.id?` id="cv-${o.id}"`:'';const r=o.rect?' rect':'';
 if(!cv||cv.t==='visible')return o.keep?`<i class="cv keep"${id} style="${st}"><em>${o.keep}</em></i>`:'';
 if(cv.t==='emoji'||cv.t==='sticker')return `<i class="cv emoji"${id} style="${st};font-size:${Math.min(p.w,p.h)*.95}px">${cv.v}</i>`;
 if(cv.t==='blur')return `<i class="cv blur ${cv.v}${r}"${id} style="${st};--b:${cv.s||12}px"></i>`;
 if(cv.t==='pixel'){const n={mosaic:7,'8bit':4,fine:12}[cv.v]||7;const[cx,cy,w,h]=b;return `<i class="cv pixel${r}"${id} style="${st}"><canvas data-px="${G.video?'video':G.img}|${cx}|${cy}|${w*g}|${h*g}|${o.rect?n*3:n}"></canvas></i>`;}
 if(cv.t==='shape')return `<i class="cv shape${r}"${id} style="${st};background:${cv.v}"></i>`;
 if(cv.t==='ai'){
  if(cv.v==='ghost')return `<i class="cv ghost"${id} style="${st}"></i>`;
  if(cv.v==='erase')return `<i class="cv erase"${id} style="${st}"></i>`;
  const[sx,sy]=FACES.selfie_b;const Z=3.4,ih=Z/AR.selfie;const px=(sx*Z-.5)/(Z-1)*100,py=(sy*ih-.5)/(ih-1)*100;
  return `<i class="cv swap"${id} style="${st};background-image:url(img/selfie.jpg);background-size:${Z*100}% auto;background-position:${px}% ${py}%"></i>`;
 }
 return '';
}
function photo(G,layers,attrs=''){const media=G.video?`<video class="img" id="vid" src="img/party.mp4" playsinline preload="auto" style="top:${G.T}px;height:${G.IH}px;object-fit:fill"></video>`:`<div class="img" style="background-image:url(img/${G.img}.jpg);top:${G.T}px;height:${G.IH}px"></div>`;return `<div class="photo" ${attrs} style="width:${G.W}px;height:${G.H}px">${media}${layers}</div>`;}
function peopleLayers(G,o={}){
 let h='';const tt=o.t!=null?o.t:null;
 for(const p of S.people){h+=coverEl(faceAt(p.face,tt),p.cover,G,{id:p.id,keep:p.isMe?'You':(o.keepAll&&p.cover.t==='visible'?p.name:null),size:S.size});}
 if(o.objects!==false)for(const ob of S.objects){if(ob.on)h+=coverEl(ob.box,ob.cover,G,{id:ob.id,grow:1,rect:true});}
 if(o.hot){for(const p of S.people){const q=bx(faceAt(p.face,tt),1.5,G);const w=Math.max(q.w,48),hh=Math.max(q.h,48);h+=`<b class="hot" id="hot-${p.id}" data-act="studio" data-id="${p.id}" style="left:${q.l+q.w/2-w/2}px;top:${q.t+q.h/2-hh/2}px;width:${w}px;height:${hh}px"></b>`;}
  for(const ob of S.objects){if(!ob.on)continue;const q=bx(ob.box,1,G);h+=`<b class="hot" data-act="studio" data-id="${ob.id}" style="border-radius:10px;${pst({l:q.l,t:q.t,w:Math.max(q.w,44),h:Math.max(q.h,44)})}"></b>`;}}

}

/* ===================== checks ===================== */
function checks(){
 const others=S.people.filter(p=>!p.isMe),unc=others.filter(p=>p.cover.t==='visible');
 const bgOk=!S.bg.count||(S.bg.cover.t!=='visible'&&S.bgFaces.every(x=>x));
 const p2=S.people.find(p=>p.id==='p2');
 const sty=[...S.people.filter(p=>p.cover.t==='blur'),...(S.bg.count&&S.bg.cover.t==='blur'?[{name:'Background people'}]:[]),...S.objects.filter(o=>o.on&&o.cover.t==='blur')];
 const me=S.people.find(p=>p.isMe);
 const total=others.length+S.bg.count;
 return [
  {ok:unc.length===0&&bgOk,okT:total?`${total} people covered`:'No faces in this video',badT:unc.length?`${unc.map(p=>p.name).join(', ')} not covered`:'Some background people are visible',fix:'Review',act:'fixPeople'},
  {ok:S.gapFixed||!p2||p2.cover.t==='visible',okT:'Covered in every frame',badT:'Person 2 uncovered for 0.4 s',fix:'Fix',act:'fixGap'},
  {ok:sty.length===0,okT:'Every cover is privacy-grade',badT:`${sty[0]?sty[0].name:''} uses blur — can be reversed`,fix:'Use Pixel',act:'fixBlur'},
  {ok:true,info:true,okT:me?(me.cover.t==='visible'?'You stay visible':'You’re covered too'):'No “You” marked — everyone treated the same'},
  {ok:S.stripMeta,okT:'Location & camera info removed',badT:'Location is saved in the file',fix:'Remove',act:'fixMeta'},
  {ok:S.audio.maya!=='off'&&S.audio.addr!=='off',okT:'Name & address muted in audio',badT:'“Maya” and an address are spoken',fix:'Bleep',act:'fixAudio'},
 ];
}
const score=()=>checks().filter(c=>c.ok).length;

 S.gapFixed=false;S.undo=[];S.redo=[];S.size=1;S.hintSeen=false;S.t=0;
}
function applyQuick(q){
 for(const p of S.people){

}

/* ===================== render ===================== */
let TIMERS=[];
const every=(ms,fn)=>TIMERS.push(setInterval(fn,ms)),later=(ms,fn)=>TIMERS.push(setTimeout(fn,ms));
const clearT=()=>{TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t)});TIMERS=[];S.playing=false;S.audioT=-1;cancelAnimationFrame(window._raf);const v=$('#vid');if(v)v.pause();};
function render(anim){
 const host=$('#screen');const prev=host.querySelector('.body');const sc=prev&&!anim?prev.scrollTop:0;
 const el=document.createElement('div');el.className='scr '+(THEME[S.screen]||'light')+(anim?' a-'+anim:'');el.innerHTML=SCR[S.screen]()+'<div class="hind"></div>';
 host.innerHTML='';host.appendChild(el);const nb=el.querySelector('.body');if(nb&&sc)nb.scrollTop=sc;
  drawPixels();renderPanel();renderNotes();
 const v=$('#vid');if(v&&!S.playing){const seek=()=>{try{v.currentTime=Math.min(DUR-0.05,S.t);}catch(e){}};if(v.readyState>=1)seek();else v.addEventListener('loadedmetadata',seek,{once:true});v.addEventListener('seeked',()=>{syncCovers();},{once:true});}
}
function renderSheet(animate){
 const L=$('#sheetLayer');if(!S.sheet){L.innerHTML='';L.className='';return;}
 const d=SH[S.sheet];const dark=THEME[S.screen]==='dark';const prev=L.querySelector('.shb');const sc=prev&&!animate?prev.scrollTop:0;
 const html=d.html();if(!html){S.sheet=null;L.innerHTML='';L.className='';return;}
 L.className='on';L.innerHTML=`<div class="scrim" ${d.modal?'':'data-act="closeSheet"'}></div><div class="sheet-l ${dark?'dark':'light'} ${d.cls||''} ${animate?'in':''}">${d.modal?'':'<i class="grabber"></i>'}<div class="shb">${html}</div></div>`;
 const nb=L.querySelector('.shb');if(sc)nb.scrollTop=sc;drawPixels();
}
const openSheet=s=>{S.sheet=s;$('#toastL').innerHTML='';renderSheet(true);};
const closeSheet=()=>{S.sheet=null;renderSheet();};
function drawPixels(){
 $$('canvas[data-px]').forEach(c=>{const[im,cx,cy,w,h,n]=c.dataset.px.split('|');let I,NW,NH;if(im==='video'){I=c.closest('.photo')&&c.closest('.photo').querySelector('video');if(!I||I.readyState<2)return;NW=I.videoWidth;NH=I.videoHeight;}else{I=IMG[im];if(!I.complete||!I.naturalWidth){I.addEventListener('load',drawPixels,{once:true});return;}NW=I.naturalWidth;NH=I.naturalHeight;}
  const sw=+w*NW,sh=+h*NH;const cw=+n,chh=Math.max(2,Math.round(cw*sh/sw));c.width=cw;c.height=chh;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.drawImage(I,+cx*NW-sw/2,+cy*NH-sh/2,sw,sh,0,0,cw,chh);});
}
function go(id,{replace=false}={}){clearT();if(!replace)S.stack.push(S.screen);S.screen=id;S.sheet=null;renderSheet();render(replace?'fade':'push');ENTER[id]&&ENTER[id]();}
function back(){if(S.sheet){closeSheet();return;}clearT();if(!S.stack.length){go('home',{replace:true});return;}S.screen=S.stack.pop();renderSheet();render('pop');}
function backTo(id){const i=S.stack.lastIndexOf(id);if(i<0){go(id,{replace:true});return;}clearT();S.stack=S.stack.slice(0,i);S.screen=id;S.sheet=null;renderSheet();render('pop');}
function goHome(){clearT();S.stack=[];S.screen='home';S.sheet=null;S.quick=null;renderSheet();render('fade');}
function toast(msg,action,label){const L=$('#toastL');L.innerHTML=`<div class="toast">${msg}${action?`<button data-act="${action}"><b>${label||'Undo'}</b></button>`:''}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>{L.innerHTML=''},3400);}
function notify(title,sub,act){const L=$('#notifL');L.innerHTML=`<div class="notif" data-act="${act}"><span class="ai">${ic('shield',20)}</span><span><b>${title}</b><small>${sub}</small></span></div>`;setTimeout(()=>{L.innerHTML=''},5000);}
function flash(){const p=$('#phone');p.classList.add('flash');setTimeout(()=>p.classList.remove('flash'),650);}

/* ===================== enter hooks ===================== */
const ENTER={};
ENTER.scan=()=>{S.scanStep=0;render();every(520,()=>{S.scanStep++;if(S.scanStep>6){clearT();finishScan();return;}render();});};
ENTER.editor=()=>{if(!S.hintSeen)later(4500,()=>{if(S.screen==='editor'&&!S.hintSeen){S.hintSeen=true;render();}});};
ENTER.exporting=()=>{S.expPct=0;render();every(80,()=>{S.expPct=Math.min(100,S.expPct+3.2);const b=$('#xbar');if(b){b.style.width=S.expPct+'%';$('#xtxt').textContent=Math.round(S.expPct)+'% · '+S.quality;}if(S.expPct>=100){clearT();exportFinished();}});};
ENTER.batch=()=>{if(S.batch.phase==='ready')return;later(1400,()=>{S.batch.phase='ready';render();});};
ENTER.enroll=()=>{S.enroll=S.me?100:0;render();};
function finishScan(){
 if(S.scen.noFaces){S.people=[];S.bg={count:0,cover:{t:'visible'}};S.bgFaces=[];S.objects=[{id:'banner',name:'Banner text',box:BANNER,on:false,cover:{t:'pixel',v:'mosaic'}}];S.gapFixed=true;go('noface',{replace:true});return;}
 if(S.selection.length>1){startBatch();return;}
 scanDefaults();
 if(S.quick){applyQuick(S.quick);S.gapFixed=false;S.editorFrom='quick';go('check',{replace:true});toast(`Quick hide applied — ${S.quick==='screens'?'text covered':S.people.filter(p=>p.cover.t!=='visible').length+' people covered'}`);return;}
 S.rosterFrom='scan';go('roster',{replace:true});
}
function exportFinished(){
 if(S.scen.exportFail&&!S.failedOnce&&!S.exportBatch){S.failedOnce=true;go('failed',{replace:true});return;}
 if(S.screen!=='exporting'){toast('Export finished — saved to Photos');addProject();return;}
 go('done',{replace:true});
}
function addProject(){
 if(S.exportBatch)return;const sc=score();const st=sc===6?'Safe':`${6-sc} left`;
 const i=S.projects.findIndex(p=>p.id==='party');const pr={id:'party',img:'pv',name:'Kids party',dur:'0:10',state:st,meta:`${S.people.filter(p=>p.cover.t!=='visible').length+S.bg.count} covered · Today`,data:snap(),thumb:''};
 if(i>=0)S.projects[i]=pr;else S.projects.unshift(pr);
}
function startBatch(){S.batch={items:S.selection.map(id=>MEDIA.find(m=>m.id===id)),reviewed:{},recipe:S.recipes[0],phase:'processing'};go('batch',{replace:true});}

/* ===================== actions ===================== */
function act(a,d,e,el){
 const P=d.id&&findP(d.id);
 switch(a){
 case 'back':return back();
 case 'home':return goHome();
 case 'closeSheet':if(S.sheet==='studio'&&S.screen==='editor'){S.hintSeen=true;render();}return closeSheet();

let scrub=false;function scrubTo(e){const tl=$('#tl');if(!tl)return;const r=tl.getBoundingClientRect();const sc=r.width/(362-16+16);const x0=r.left+(8+62)*(r.width/tl.offsetWidth);const w=(tl.offsetWidth-78)*(r.width/tl.offsetWidth);const f=Math.max(0,Math.min(1,(e.clientX-x0)/w));S.t=f*DUR;const v=$('#vid');if(v){v.currentTime=Math.min(DUR-0.05,S.t);}tick();}
document.addEventListener('pointerdown',e=>{if(e.target.closest('#tl')&&!e.target.closest('[data-act]')){if(S.playing){act('play',{});}scrub=true;scrubTo(e);}});
document.addEventListener('pointermove',e=>{if(scrub)scrubTo(e);});
document.addEventListener('pointerup',()=>{scrub=false;});
/* playback tick */
function tick(){const ph=$('#ph'),tm=$('#tm');if(ph)ph.style.left=`calc((100% - 78px) * ${S.t/DUR})`;if(tm)tm.textContent=fmt(S.t);syncCovers();
 const c=$('#cv-p2');if(c){const p2=S.people.find(p=>p.id==='p2');const inGap=!S.gapFixed&&p2&&p2.cover.t!=='visible'&&S.t>=GAP[0]&&S.t<=GAP[1];c.classList.toggle('hid',inGap);}}
function syncCovers(){const G=window._G;if(!G||S.screen!=='editor')return;
 for(const p of S.people){const b=faceAt(p.face,S.t);const el=document.getElementById('cv-'+p.id);
  if(el){const g=(1.32)*(S.size||1);const q=bx(b,g,G);el.style.left=q.l+'px';el.style.top=q.t+'px';el.style.width=q.w+'px';el.style.height=q.h+'px';if(el.classList.contains('emoji'))el.style.fontSize=Math.min(q.w,q.h)*.95+'px';
   const c=el.querySelector('canvas');if(c){c.dataset.px=`video|${b[0]}|${b[1]}|${b[2]*g}|${b[3]*g}|${c.dataset.px.split('|')[5]}`;}}
  const h=document.getElementById('hot-'+p.id);if(h){const q=bx(b,1.5,G);const w=Math.max(q.w,48),hh=Math.max(q.h,48);h.style.left=(q.l+q.w/2-w/2)+'px';h.style.top=(q.t+q.h/2-hh/2)+'px';}}
 drawPixels();}
/* scale device */
function fit(){const d=$('#device');const small=innerWidth<=820;const pad=small?0:24;const s=Math.min(1,(innerHeight-40+(small?40:0))/(844+(small?0:24)),(small?innerWidth:innerWidth)/(390+(small?0:24)));d.style.transform=`scale(${s})`;$('#devwrap').style.height=(868*s)+'px';}
addEventListener('resize',fit);fit();
render('fade');
</script>
